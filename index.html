
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#103f30">
<link rel="manifest" href="./manifest.json">
<title>CRPF MESS MANAGER</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🛡️ CRPF MESS MANAGER</h1>
  <p>Offline Mess Account & Store System</p>
</header>

<nav>
  <button onclick="show('dashboard')">Dashboard</button>
  <button onclick="show('members')">Members</button>
  <button onclick="show('store')">Ration Store</button>
  <button onclick="show('purchases')">Purchases</button>
  <button onclick="show('recipes')">Recipes</button>
  <button onclick="show('meals')">Meals</button>
  <button onclick="show('accounts')">Accounts</button>
  <button onclick="show('backup')">Backup</button>
</nav>

<main>
<section id="dashboard" class="page active">
<h2>Mess Dashboard</h2>
<div class="grid" id="stats"></div>
<h3>Recent Transactions</h3>
<div id="recent"></div>
</section>

<section id="members" class="page">
<h2>Members</h2>
<div class="card">
<input id="mno" placeholder="Force / Member Number">
<input id="mname" placeholder="Full Name">
<select id="mrank">
<option>Constable</option><option>Head Constable</option>
<option>ASI</option><option>SI</option><option>Inspector</option><option>Other</option>
</select>
<input id="mphone" placeholder="Mobile Number">
<input id="mdate" type="date">
<button onclick="addMember()">Add Member</button>
</div>
<div id="memberList"></div>
</section>

<section id="store" class="page">
<h2>Ration Store</h2>
<div class="card">
<input id="itemName" placeholder="Item Name">
<select id="itemUnit">
<option value="kg">KG</option><option value="l">Litre</option><option value="pcs">Piece</option>
</select>
<button onclick="addItem()">Add Store Item</button>
</div>
<p class="note">Purchase KG/Litre/Piece mein hogi. Stock gram/ml/piece mein automatically convert hoga.</p>
<div id="storeList"></div>
</section>

<section id="purchases" class="page">
<h2>Ration Purchases</h2>
<div class="card">
<label>Item</label><select id="pItem"></select>
<label>Purchase Quantity</label><input id="pQty" type="number" step="any" placeholder="Quantity">
<label>Purchase Unit</label>
<select id="pUnit">
<option value="kg">KG</option><option value="g">Gram</option>
<option value="l">Litre</option><option value="ml">ML</option>
<option value="pcs">Piece</option>
</select>
<label>Rate per selected unit (Rs)</label>
<input id="pRate" type="number" step="any" placeholder="Unit price">
<input id="pSupplier" placeholder="Supplier">
<input id="pDate" type="date">
<button onclick="addPurchase()">Save Purchase</button>
</div>
<div id="purchaseList"></div>
</section>

<section id="recipes" class="page">
<h2>Recipes</h2>
<div class="card">
<input id="rName" placeholder="Recipe Name">
<div class="row">
<select id="rItem"></select>
<input id="rQty" type="number" step="any" placeholder="Quantity">
<select id="rUnit">
<option value="g">Gram</option><option value="ml">ML</option><option value="pcs">Piece</option>
</select>
</div>
<button onclick="addIngredient()">Add Ingredient</button>
<div id="ingredientDraft"></div>
<button onclick="saveRecipe()">Save Recipe</button>
</div>
<div id="recipeList"></div>
</section>

<section id="meals" class="page">
<h2>Making Menu / Meals</h2>
<div class="card">
<input id="mealDate" type="date">
<select id="mealType">
<option>Morning Tea</option><option>Breakfast</option>
<option>Lunch</option><option>Midday Tea</option><option>Dinner</option>
</select>
<select id="mealRecipe"></select>
<input id="mealServings" type="number" min="1" value="1" placeholder="Servings">
<button onclick="showMealCost()">Calculate Cost</button>
<div id="mealPreview"></div>
<div id="mealMembers"></div>
<button onclick="confirmMeal()">Confirm Meal & Deduct Stock</button>
</div>
<div id="mealList"></div>
</section>

<section id="accounts" class="page">
<h2>Accounts</h2>
<div class="card">
<select id="aMember"></select>
<select id="aType">
<option value="deposit">Member Deposit / Advance</option>
<option value="expense">Mess Expense</option>
</select>
<input id="aAmount" type="number" step="any" placeholder="Amount Rs">
<input id="aNote" placeholder="Details">
<button onclick="addTransaction()">Save Transaction</button>
</div>
<div id="accountList"></div>
</section>

<section id="backup" class="page">
<h2>Backup & Restore</h2>
<div class="card">
<button onclick="downloadBackup()">Download JSON Backup</button>
<label>Restore JSON Backup</label>
<input type="file" id="restoreFile" accept=".json">
<button onclick="restoreBackup()">Restore Data</button>
</div>
</section>
</main>

<script src="app.js"></script>
</body>
</html>
